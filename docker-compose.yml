services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: iot, POSTGRES_USER: iot, POSTGRES_PASSWORD: iot }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U iot"], interval: 5s, timeout: 3s, retries: 10 }
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes: [./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    ports: ["1883:1883"]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgres://iot:iot@db:5432/iot
      MQTT_URL: mqtt://mosquitto:1883
      DATA_DIR: /data
      SIMULATION_INTERVAL_MS: 3000
    volumes: [./data:/data:ro]
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_started }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"], interval: 10s, timeout: 5s, retries: 12 }
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
